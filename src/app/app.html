<header class="topbar">
  <span class="title">Ratio Study</span>
  <span class="sub">City of Vancouver · 2026 roll</span>
</header>

<div class="body">
  <app-map-view
    class="map"
    [features]="features()"
    [selectedId]="detail()?.parcel?.id ?? null"
    (areaDrawn)="onArea($event)"
    (parcelSelected)="onParcel($event)"
  />
  <aside class="panel">
    @if (detail(); as d) {
      <app-panel-parcel [detail]="d" (back)="clearDetail()" />
    } @else if (area(); as a) {
      <app-panel-area [result]="a" (clear)="clearArea()" />
    } @else {
      <app-panel-all [parcels]="parcels()" (draw)="mapView()?.startDraw()" />
    }
  </aside>
</div>
